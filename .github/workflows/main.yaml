name: Bake and Deploy
on:
  #push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      
      - name: Set up JDK 1.8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'
          cache: 'gradle'
      
      - name: Bake 
        run: |
          curl -s "https://get.sdkman.io" | bash
          source "/home/runner/.sdkman/bin/sdkman-init.sh"
          sdk install jbake 2.6.4
          jbake -b
      
      - name: Create migration RSS feed
        run: |
          set -euo pipefail

          mkdir -p ./output

          PUB_DATE="$(date -R)"

          cat > ./output/feed.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <rss version="2.0">
            <channel>
              <title>blog.sogeo.services ist umgezogen</title>
              <link>https://blog.interlis.guru/</link>
              <description>Der Blog ist nach https://blog.interlis.guru/ umgezogen.</description>
              <language>de-ch</language>
              <lastBuildDate>${PUB_DATE}</lastBuildDate>

              <item>
                <title>Der RSS-Feed ist umgezogen</title>
                <link>https://blog.interlis.guru/feed.xml</link>
                <guid isPermaLink="false">blog-sogeo-services-feed-moved-2026-05-07</guid>
                <pubDate>${PUB_DATE}</pubDate>
                <description><![CDATA[
                  Der Blog und der RSS-Feed sind umgezogen.
                  Bitte abonnieren Sie neu:

                  https://blog.interlis.guru/feed.xml
                ]]></description>
              </item>
            </channel>
          </rss>
          EOF
                
      - name: Show files
        run: ls -la 
      
      - name: Setup Pages
        if: github.ref == 'refs/heads/master'
        uses: actions/configure-pages@v3

      - name: Upload Artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./output"

  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: build
    
    permissions:
      pages: write
      id-token: write

    environment:
      # environment created automatically by GitHub
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4      